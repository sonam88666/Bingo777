name: Build & Sign Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps || npm install

      - name: Build web assets (Optimized)
        run: |
          npm run build
          # Prune any local chat attachment media before capacitor sync
          rm -rf dist/assets/aistudio

      - name: Add Capacitor Android platform
        run: npx cap add android || true

      - name: Sync Capacitor Android
        run: |
          npx cap sync android
          # Ensure no heavy chat videos/attachments are included in android assets
          rm -rf android/app/src/main/assets/public/assets/aistudio

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Persistent Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding persistent release keystore from KEYSTORE_BASE64 secret..."
            echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > android/app/app-release-key.jks
          elif [ ! -f "android/app/app-release-key.jks" ]; then
            echo "Generating fallback release keystore for signing..."
            KS_PASS="${KEYSTORE_PASSWORD:-bingo777release}"
            K_ALIAS="${KEY_ALIAS:-bingo777}"
            K_PASS="${KEY_PASSWORD:-$KS_PASS}"
            keytool -genkeypair -v \
              -keystore android/app/app-release-key.jks \
              -alias "$K_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$K_PASS" \
              -dname "CN=Bingo777, OU=Mobile, O=Bingo777, L=Mumbai, S=MH, C=IN"
          fi

      - name: Build Signed Ultra-Light Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          VERSION_CODE=$((100 + ${RUN_NUMBER:-1}))
          VERSION_NAME="1.0.${VERSION_CODE}"
          KS_PASS="${KEYSTORE_PASSWORD:-bingo777release}"
          K_ALIAS="${KEY_ALIAS:-bingo777}"
          K_PASS="${KEY_PASSWORD:-$KS_PASS}"
          echo "Building optimized release APK with versionCode=${VERSION_CODE} versionName=${VERSION_NAME}..."
          ./gradlew assembleRelease \
            -PversionCode="${VERSION_CODE}" \
            -PversionName="${VERSION_NAME}" \
            -PKEYSTORE_FILE="app-release-key.jks" \
            -PKEYSTORE_PASSWORD="${KS_PASS}" \
            -PKEY_ALIAS="${K_ALIAS}" \
            -PKEY_PASSWORD="${K_PASS}" \
            --no-daemon

      - name: Display Generated APK Size
        run: |
          echo "=== Built Release APK Details ==="
          ls -lh android/app/build/outputs/apk/release/

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bingo777-signed-release-apk
          path: android/app/build/outputs/apk/release/*.apk
