name: Build & Sign Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies with Bun
        run: bun install

      - name: Build Web Application (Generates dist/)
        run: |
          bun run build
          # Remove any local AI Studio chat video attachments if present so they don't bloat the APK
          rm -rf dist/assets/aistudio
          echo "=== Verifying dist/ build output ==="
          ls -lah dist/
          ls -lah dist/assets/
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html was not generated by 'bun run build'!"
            exit 1
          fi

      - name: Sync & Copy Web Assets into Capacitor Android
        run: |
          npx cap sync android
          npx cap copy android
          # Ensure no chat video attachments exist inside Android public assets
          rm -rf android/app/src/main/assets/public/assets/aistudio

      - name: Verify Android Public Assets Before Gradle Build
        run: |
          ASSETS_DIR="android/app/src/main/assets/public"
          echo "=== Checking Capacitor Android Assets in ${ASSETS_DIR} ==="
          if [ ! -d "$ASSETS_DIR" ]; then
            echo "ERROR: Directory $ASSETS_DIR does not exist!"
            exit 1
          fi
          if [ ! -f "$ASSETS_DIR/index.html" ]; then
            echo "ERROR: $ASSETS_DIR/index.html is missing!"
            exit 1
          fi
          FILE_COUNT=$(find "$ASSETS_DIR" -type f | wc -l)
          echo "Total files synced into $ASSETS_DIR: $FILE_COUNT"
          if [ "$FILE_COUNT" -lt 3 ]; then
            echo "ERROR: $ASSETS_DIR appears incomplete or empty (found only $FILE_COUNT files)!"
            exit 1
          fi
          JS_COUNT=$(find "$ASSETS_DIR/assets" -name "*.js" -type f | wc -l)
          if [ "$JS_COUNT" -lt 1 ]; then
            echo "ERROR: No compiled JS bundle found in $ASSETS_DIR/assets!"
            exit 1
          fi
          ls -lah "$ASSETS_DIR"
          ls -lah "$ASSETS_DIR/assets"
          du -sh "$ASSETS_DIR"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Release Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android/app
          KEYSTORE_PATH="android/app/release-key.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from KEYSTORE_BASE64 secret..."
            echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > "$KEYSTORE_PATH"
          elif [ ! -f "$KEYSTORE_PATH" ]; then
            echo "KEYSTORE_BASE64 secret not set; generating fallback release keystore..."
            KS_PASS="${KEYSTORE_PASSWORD:-bingo777release}"
            K_ALIAS="${KEY_ALIAS:-bingo777}"
            K_PASS="${KEY_PASSWORD:-$KS_PASS}"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias "$K_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$K_PASS" \
              -dname "CN=Bingo777 Pro, OU=Mobile, O=Bingo777, L=Mumbai, S=MH, C=IN"
          else
            echo "Using persistent release keystore at $KEYSTORE_PATH"
          fi
          ls -lh "$KEYSTORE_PATH"

      - name: Build Signed Release APK with Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          VERSION_CODE=$((200 + ${GITHUB_RUN_NUMBER:-2}))
          VERSION_NAME="2.0.${VERSION_CODE}"
          KS_PASS="${KEYSTORE_PASSWORD:-bingo777release}"
          K_ALIAS="${KEY_ALIAS:-bingo777}"
          K_PASS="${KEY_PASSWORD:-$KS_PASS}"
          echo "Building signed release APK (versionCode=${VERSION_CODE}, versionName=${VERSION_NAME})..."
          ./gradlew clean assembleRelease \
            -PversionCode="${VERSION_CODE}" \
            -PversionName="${VERSION_NAME}" \
            -PKEYSTORE_FILE="release-key.jks" \
            -PKEYSTORE_PASSWORD="${KS_PASS}" \
            -PKEY_ALIAS="${K_ALIAS}" \
            -PKEY_PASSWORD="${K_PASS}" \
            --no-daemon --stacktrace

      - name: Verify Built APK Output
        run: |
          echo "=== Release APK Output Directory ==="
          ls -lh android/app/build/outputs/apk/release/
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK file generated!"
            exit 1
          fi
          echo "Verified APK file: $APK_FILE"
          unzip -l "$APK_FILE" | grep "assets/public/" | head -n 25

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bingo777-signed-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
