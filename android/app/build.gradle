apply plugin: 'com.android.application'

def runNumber = System.getenv('GITHUB_RUN_NUMBER') ? System.getenv('GITHUB_RUN_NUMBER').toInteger() : 0
def resolvedVersionCode = (project.hasProperty('versionCode')
    ? project.property('versionCode').toInteger()
    : (System.getenv('VERSION_CODE')
        ? System.getenv('VERSION_CODE').toInteger()
        : (runNumber > 0 ? (200 + runNumber) : 2)))

def resolvedVersionName = (project.hasProperty('versionName')
    ? project.property('versionName').toString()
    : (System.getenv('VERSION_NAME') ?: "2.0.${resolvedVersionCode}"))

def keystorePath = project.hasProperty('KEYSTORE_FILE')
    ? project.property('KEYSTORE_FILE').toString()
    : (System.getenv('KEYSTORE_FILE') ?: 'release-key.jks')

def keystoreFile = file(keystorePath)
def ksPassword = project.hasProperty('KEYSTORE_PASSWORD')
    ? project.property('KEYSTORE_PASSWORD').toString()
    : (System.getenv('KEYSTORE_PASSWORD') ?: 'bingo777release')
def kAlias = project.hasProperty('KEY_ALIAS')
    ? project.property('KEY_ALIAS').toString()
    : (System.getenv('KEY_ALIAS') ?: 'bingo777')
def kPassword = project.hasProperty('KEY_PASSWORD')
    ? project.property('KEY_PASSWORD').toString()
    : (System.getenv('KEY_PASSWORD') ?: ksPassword)

android {
    namespace = "com.bingo777.pro.game"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.bingo777.pro.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~:!aistudio'
        }
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword ksPassword
                keyAlias kAlias
                keyPassword kPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/*.version',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
