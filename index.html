    <script>
      // Self-healing boot guard for Android APK WebView & stale Service Worker caches
      (function () {
        var isCapacitorOrLocal =
          typeof window !== 'undefined' &&
          (Boolean(window.Capacitor) ||
            window.location.protocol === 'capacitor:' ||
            window.location.protocol === 'file:' ||
            window.location.hostname === 'localhost' ||
            /wv|Version\/[\d.]+.*Chrome/i.test(navigator.userAgent || ''));

        if (isCapacitorOrLocal) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (reg) {
                reg.unregister();
              });
            }).catch(function () {});
          }
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) {
                caches.delete(k);
              });
            }).catch(function () {});
          }
        }

        // Recover automatically if a stale cached HTML references an old JS/CSS bundle hash
        window.addEventListener(
          'error',
          function (e) {
            var target = e && e.target;
            if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
              var src = target.src || target.href || '';
              if (src.indexOf('/assets/') !== -1 && !sessionStorage.getItem('bingo777_asset_recovered')) {
                sessionStorage.setItem('bingo777_asset_recovered', '1');
                var p1 = 'serviceWorker' in navigator
                  ? navigator.serviceWorker.getRegistrations().then(function (regs) {
                      return Promise.all(regs.map(function (r) { return r.unregister(); }));
                    }).catch(function () {})
                  : Promise.resolve();
                var p2 = 'caches' in window
                  ? caches.keys().then(function (keys) {
                      return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                    }).catch(function () {})
                  : Promise.resolve();
                Promise.all([p1, p2]).then(function () {
                  window.location.reload();
                });
              }
            }
          },
          true
        );
      })();
    </script>
